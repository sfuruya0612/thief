[env]
GOPATH = "{{env.HOME}}/go"

[tools]
# backend/go.mod の toolchain 行と同一バージョンに揃える (AGENTS.md「backend ビルドと CI」参照)
go = "1.26.6"
prek = "latest"
node = "26.4.0"
"go:github.com/vektra/mockery/v2" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

# === 全体 (ルート) ===
[tasks.setup]
description = "初期セットアップ (backend + frontend 依存取得)"
depends = ["backend:setup", "frontend:setup"]

[tasks.fmt]
description = "backend + frontend フォーマット"
depends = ["backend:fmt", "frontend:fmt"]

[tasks.lint]
description = "backend + frontend Lint"
depends = ["backend:lint", "frontend:lint"]

[tasks.test]
description = "backend + frontend テスト"
depends = ["backend:test", "frontend:test"]

[tasks.check]
description = "PR 提出前の最終確認 (fmt + lint + test)"
depends = ["fmt", "lint", "test"]

# === backend ===
[tasks."backend:setup"]
description = "backend 依存取得"
dir = "backend"
run = "go mod download && go mod tidy"

[tasks."backend:build"]
description = "backend ビルド"
dir = "backend"
run = "go build ./..."

[tasks."backend:install"]
description = "thief CLI を $GOPATH/bin にインストール"
dir = "backend"
run = "go install ./cmd/thief"

[tasks."backend:test"]
description = "backend ユニットテスト (race)"
dir = "backend"
run = "go test -race -cover ./..."

[tasks."backend:tools"]
description = "go: 管理ツールのビルド時 Go バージョンを検査し、不一致なら再ビルド"
dir = "backend"
run = """
#!/bin/sh
# 旧ツールチェインでビルドされた go: ツールが残ると、go vet は通るのに
# staticcheck だけ「file requires newer Go version」で失敗する分かりにくい事象になる。
# lint の前にビルド時 Go バージョンをアクティブな Go 本体と比較し、不一致のツールだけ再ビルドする。
set -eu
goversion="$(go env GOVERSION)"
# POSIX sh には pipefail が無くパイプ先頭の失敗を検知できないため、mise ls の結果は代入で受けて失敗時に止める
ls_output="$(mise ls --current)"
tools="$(printf '%s\n' "$ls_output" | awk '$1 ~ /^go:/ {print $1}')"
for module in $tools; do
  modpath="${module#go:}"
  bin="${modpath##*/}"
  # モジュールパス末尾がメジャーバージョン (v2 等) の場合、バイナリ名はその 1 つ手前のセグメント
  if printf '%s' "$bin" | grep -Eq '^v[0-9]+$'; then
    parent="${modpath%/*}"
    bin="${parent##*/}"
  fi
  if ! toolpath="$(mise which "$bin" 2>/dev/null)"; then
    # 未導入のツールは再ビルド対象にしない (導入は mise の [tools] 宣言による自動プロビジョニングに任せる)
    echo "skip $bin: not installed"
    continue
  fi
  # go version -m 自体の失敗は代入で止める。ビルド時バージョンは 1 行目 (<パス>: goX.Y.Z) の
  # 末尾フィールドから取り、ツールのパスに空白が含まれても壊れないようにする
  version_output="$(go version -m "$toolpath")"
  built="$(printf '%s\n' "$version_output" | awk 'NR==1 {print $NF}')"
  case "$built" in
  go[0-9]*) ;;
  *)
    # go version -m の出力形式は安定した契約ではないため、パース不能なら誤判定のまま進めず止める
    echo "error: cannot parse built Go version of $bin from 'go version -m $toolpath'" >&2
    exit 1
    ;;
  esac
  if [ "$built" = "$goversion" ]; then
    echo "skip $bin: built with $built (matches active toolchain)"
  else
    echo "rebuild $bin: built with $built, active toolchain is $goversion"
    # 再ビルドは [tools] の go: ツールがすべて "latest" 指定である前提で @latest 固定とする。
    # 特定バージョンを pin した go: ツールを追加する場合はここも合わせて見直すこと。
    mise install --force "${module}@latest" </dev/null
  fi
done
"""

[tasks."backend:lint"]
description = "backend 静的解析"
dir = "backend"
depends = ["backend:tools"]
run = """
go vet ./...
staticcheck ./...
govulncheck ./...
"""

[tasks."backend:fmt"]
description = "backend フォーマット"
dir = "backend"
run = """
gofmt -w .
goimports -w .
"""

[tasks."backend:tidy"]
description = "backend go mod tidy"
dir = "backend"
run = "go mod tidy -v"

[tasks."backend:update"]
description = "backend 依存更新"
dir = "backend"
run = "go get -u ./..."
depends_post = ["backend:tidy"]

[tasks."backend:mocks"]
description = "mockery でモック生成"
dir = "backend"
run = "mockery"

[tasks."backend:run"]
description = "API サーバー起動 (127.0.0.1:8089)"
dir = "backend"
depends = ["backend:install"]
run = "thief server"

# === frontend ===
[tasks."frontend:setup"]
description = "frontend 依存取得"
dir = "frontend"
run = "npm install"

[tasks."frontend:fetch-aws-icons"]
description = "AWS 公式アイコン (zip) を public/assets/aws-icons/ に展開する (引数: zip ファイルパス)"
dir = "frontend"
usage = "arg \"<zip>\" help=\"AWS 公式アイコンパッケージの zip ファイルパス\""
run = "node scripts/fetch-aws-icons.mjs \"$usage_zip\""

[tasks."frontend:fetch-gcp-icons"]
description = "Google Cloud 公式アイコン (zip) を public/assets/gcp-icons/ に展開する (引数: zip ファイルパス、複数指定可)"
dir = "frontend"
usage = "arg \"<zip>\" var=#true help=\"Google Cloud 公式アイコンパッケージの zip ファイルパス (複数指定可)\""
run = "node scripts/fetch-gcp-icons.mjs $usage_zip"

[tasks."frontend:update"]
description = "frontend 依存更新"
dir = "frontend"
run = "npm update"

[tasks."frontend:build"]
description = "frontend ビルド (Web)"
dir = "frontend"
run = "npm run build"

[tasks."frontend:test"]
description = "frontend ユニットテスト (vitest)"
dir = "frontend"
run = "npm run test"

[tasks."frontend:lint"]
description = "frontend Lint (eslint + tsc)"
dir = "frontend"
run = "npm run lint"

[tasks."frontend:fmt"]
description = "frontend フォーマット (prettier)"
dir = "frontend"
run = "npm run fmt"

[tasks."frontend:run"]
description = "Vite dev server 起動 (ブラウザで http://localhost:8088 を開く)"
dir = "frontend"
run = "npm run dev"

[tasks."frontend:serve"]
description = "frontend ビルドして dist を静的サーブ (vite preview, ポート 8088)"
dir = "frontend"
run = "npm run build && npm run preview"

# === example (floci によるローカル動作確認環境) ===
[tasks."example:up"]
description = "floci (AWS エミュレータ) を起動する (backend/frontend は別途 mise run backend:run / frontend:run で起動すること)"
run = "docker compose -f example/compose.yaml up"

[tasks."example:down"]
description = "floci を停止する"
run = "docker compose -f example/compose.yaml down"

[tasks."example:seed"]
description = "floci にサンプルリソース (S3/DynamoDB/SQS/SSM/Secrets Manager/CloudFormation) を投入"
run = "./example/seed.sh"
